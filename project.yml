name: Hermit
options:
  bundleIdPrefix: com.hermit
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: "0.10.0"
  mlx-swift-lm:
    url: https://github.com/DePasqualeOrg/mlx-swift-lm.git
    branch: swift-tokenizers
  swift-tokenizers-mlx:
    url: https://github.com/DePasqualeOrg/swift-tokenizers-mlx
    branch: main
  swift-hf-api-mlx:
    url: https://github.com/DePasqualeOrg/swift-hf-api-mlx
    branch: main

targets:
  Hermit:
    type: application
    platform: iOS
    sources:
      - path: Hermit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_ENTITLEMENTS: Hermit/Hermit.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.hermit.Hermit
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXEmbedders
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-tokenizers-mlx
        product: MLXLMTokenizers
      - package: swift-hf-api-mlx
        product: MLXLMHFAPI
      - package: swift-hf-api-mlx
        product: MLXEmbeddersHFAPI
