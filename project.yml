name: Hermit
options:
  bundleIdPrefix: com.hermit
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.31.4"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    # Latest tag cannot load Gemma E2B shared-KV layers; pin the upstream fix.
    revision: "68947ccdca79bcf7a26dc220f73caa060369513c"
  swift-tokenizers-mlx:
    url: https://github.com/DePasqualeOrg/swift-tokenizers-mlx
    exactVersion: "0.3.0"
  swift-hf-api-mlx:
    url: https://github.com/DePasqualeOrg/swift-hf-api-mlx
    exactVersion: "0.2.0"
  # Keep the adapters on their supported HubClient/tokenizer API versions.
  swift-tokenizers:
    url: https://github.com/DePasqualeOrg/swift-tokenizers.git
    exactVersion: "0.5.0"
  swift-hf-api:
    url: https://github.com/DePasqualeOrg/swift-hf-api.git
    exactVersion: "0.3.2"

targets:
  Hermit:
    type: application
    platform: iOS
    sources:
      - path: Hermit
        excludes:
          - "Resources/**"
    resources:
      - path: Hermit/Resources
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSCameraUsageDescription: "Hermit uses the camera to take photos for AI visual analysis"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Hermit uses your photos to provide visual context for AI conversations"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_ENTITLEMENTS: Hermit/Hermit.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.hermit.Hermit
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXEmbedders
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-tokenizers-mlx
        product: MLXLMTokenizers
      - package: swift-hf-api-mlx
        product: MLXLMHFAPI

  HermitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HermitTests
    dependencies:
      - target: Hermit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
