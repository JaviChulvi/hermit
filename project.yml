name: Hermit
options:
  bundleIdPrefix: com.hermit
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  Hermit:
    type: application
    platform: iOS
    sources:
      - path: Hermit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_ENTITLEMENTS: Hermit/Hermit.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.hermit.Hermit
        SWIFT_STRICT_CONCURRENCY: complete
